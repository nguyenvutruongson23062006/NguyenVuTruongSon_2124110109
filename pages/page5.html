<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1-Buổi 3</title>
</head>
<body>
    <h1>Thông tin khách hàng</h1>
    <form action="">
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <label for="f-fullname">Họ và tên:</label>
            <input type="text" name="fullname" id="f-fullname" placeholder="Nhập họ và tên" maxlength="50" required>
            <br><br>
            <label for="f-Email">Email:</label>
            <input type="email" name="Email" id="f-Email" placeholder="Nhập email" maxlength="50" required>
            <br><br>
            <label for="f-SDT">Số điện thoại:</label>
            <input type="tel" name="SDT" id="f-SDT" placeholder="Nhập số điện thoại" maxlength="12" required>
            <br><br>
            <label for="f-ngaysinh">Ngày sinh:</label>
            <input type="date" name="NgayS" id="f-ngaysinh" required>
            <br><br>
            <label for="f-SDT">Mật khẩu:</label>
            <input type="password" name="MK" id="f-MK" placeholder="Nhập mật khẩu" maxlength="50" required>
            <br><br>
            <input type="submit" value="Gửi thông tin">
            <input type="reset" value="Nhập lại">
        </fieldset>
    </form>
</body>
</html>
